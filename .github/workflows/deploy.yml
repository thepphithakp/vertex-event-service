name: Build, Push and Hand off to Argo CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ตรวจว่าไม่มีความลับหลุดเข้า repo
        run: ./scripts/check-secrets.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Test (race)
        run: go test -race -count=1 ./...
      # ⚠️ .golangci.yml ใช้ config schema version 2 จึงต้องใช้ golangci-lint v2
      #    action v6 ผูกกับ v1.x ที่ build ด้วย Go 1.23
      #    อ่านโปรเจกต์ที่ target Go 1.25 ไม่ได้ → CI ล้มทั้ง pipeline
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ---------------------------------------------------------------------------
  # ส่งมอบให้ Argo CD — แก้ image tag ใน vertex-gitops แล้วปล่อยให้ Argo sync เอง
  # ---------------------------------------------------------------------------
  # CI ไม่มี kubeconfig และไม่แตะ cluster อีกแล้ว ผลของ deploy ดูที่ Argo CD
  # (https://argocd.pluem.me) ไม่ใช่ที่ job นี้ — job เขียวแปลว่า tag ถูก push แล้วเท่านั้น
  #
  # ⚠️ ใช้ deploy key ที่เขียนได้เฉพาะ repo vertex-gitops (secret GITOPS_DEPLOY_KEY)
  #    GITHUB_TOKEN เขียนข้าม repo ไม่ได้ และไม่อยากใช้ PAT ที่กว้างเกินจำเป็น
  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push
    # เขียนไฟล์เดียวกัน ถ้าสอง push ชนกันให้ต่อคิว ไม่ยกเลิกตัวที่รออยู่
    concurrency:
      group: gitops-event-service
      cancel-in-progress: false
    steps:
      - name: Checkout vertex-gitops
        uses: actions/checkout@v4
        with:
          repository: thepphithakp/vertex-gitops
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Bump image tag
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: sha-${{ github.sha }}
          SRC_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          f=apps/event-service/values.yaml
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(TAG)' "$f"

          if git diff --quiet; then
            echo "tag ใน gitops เป็น $TAG อยู่แล้ว ไม่มีอะไรต้อง commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(event-service): image ${TAG:0:11}" -m "$SRC_URL"

          # push ชนกับ commit ของ service อื่นได้ ให้ rebase แล้วลองใหม่
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::push เข้า vertex-gitops ไม่สำเร็จหลังลอง 3 ครั้ง"
          exit 1

  # ---------------------------------------------------------------------------
  # แจ้งผลการส่งมอบเข้า Discord
  # ---------------------------------------------------------------------------
  # if: always() จำเป็น — ไม่งั้น job นี้จะรันเฉพาะตอน deploy สำเร็จ
  # ซึ่งกลับหัวกลับหางกับสิ่งที่อยากได้ เพราะกรณีที่ต้องรีบรู้คือตอนมันล้ม
  #
  # needs.update-gitops.result เป็น skipped ได้ด้วย แปลว่า job ก่อนหน้าล้มจน
  # ไม่ได้ส่งมอบเลย ต้องนับเป็นความล้มเหลว ไม่ใช่ปล่อยผ่านเงียบๆ
  #
  # ⚠️ webhook URL อยู่ใน secret DISCORD_DEPLOY_WEBHOOK เท่านั้น
  #    repo นี้เป็น public ห้ามใส่ลงไฟล์เด็ดขาด
  notify:
    runs-on: ubuntu-latest
    needs: update-gitops
    if: always()
    steps:
      - name: แจ้งผลการส่งมอบเข้า Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RESULT: ${{ needs.update-gitops.result }}
          SERVICE: event-service
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # ไม่ตั้ง secret ก็ไม่ควรทำให้ workflow แดง — แค่เตือนแล้วผ่านไป
          # จะได้ fork หรือ repo ที่ยังไม่ได้ตั้งค่ายัง deploy ได้ตามปกติ
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret DISCORD_DEPLOY_WEBHOOK — ข้ามการแจ้งเตือน"
            exit 0
          fi

          case "$RESULT" in
            success)   color=3066993;  icon="✅"; text="ส่งมอบให้ Argo CD แล้ว" ;;
            failure)   color=15158332; icon="❌"; text="ส่งมอบให้ Argo CD ล้มเหลว" ;;
            cancelled) color=9807270;  icon="⚪"; text="ส่งมอบถูกยกเลิก" ;;
            skipped)   color=15158332; icon="❌"; text="ไม่ได้ส่งมอบ — ขั้นก่อนหน้าล้ม" ;;
            *)         color=9807270;  icon="❔"; text="ส่งมอบจบด้วยสถานะ $RESULT" ;;
          esac

          # สร้าง JSON ด้วย jq ไม่ใช่ต่อ string เอง
          # commit message มี " หรือ newline ได้ ซึ่งจะทำ payload พังเงียบๆ
          jq -n \
            --arg title "$icon $SERVICE — $text" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg msg "$(printf '%s' "$COMMIT_MSG" | head -1 | cut -c1-120)" \
            --arg who "${GITHUB_ACTOR}" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson color "$color" \
            '{embeds:[{
               title: $title,
               url: $url,
               color: $color,
               fields: [
                 {name:"commit", value:("`"+$sha+"` "+$msg), inline:false},
                 {name:"โดย",    value:$who,  inline:true},
                 {name:"image",  value:("sha-"+$sha), inline:true}
               ],
               footer:{text:"namespace vertex"}
             }]}' > payload.json

          # --fail-with-body ทำให้ job นี้แดงถ้า Discord ปฏิเสธ
          # การส่งมอบที่สำเร็จไปแล้วไม่ถูกย้อน แต่จะไม่เงียบว่าแจ้งเตือนไม่ออก
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -d @payload.json "$WEBHOOK"
