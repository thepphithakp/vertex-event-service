replicaCount: 1

image:
  repository: ghcr.io/thepphithakp/vertex-event-service
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 4002
# --- Gateway API ----------------------------------------------------------
#
# ⚠️ ยังปิดอยู่โดยตั้งใจ — ตอนนี้ infra/gateway/03-httproute-event.yaml เป็นเจ้าของ route
#    ของ event-service อยู่ เปิดตรงนี้พร้อมกันจะได้ HTTPRoute สองตัวชี้ path เดียวกัน
#
# ลำดับที่ถูกต้องตอนย้ายมาให้ chart เป็นเจ้าของ:
#   1. kubectl apply -f infra/gateway/05-rbac-httproute.yaml   (สิทธิ์ของ CD)
#   2. kubectl delete -f infra/gateway/03-httproute-event.yaml
#   3. เปลี่ยน enabled เป็น true แล้ว deploy
httpRoute:
  enabled: false
  # Gateway ที่ infra/gateway/01-gateway.yaml สร้างไว้
  parentRef:
    name: vertex-gateway
    # เว้นว่าง = namespace เดียวกับ release
    namespace: ""
    # ชื่อ listener ใน Gateway — ผูกกับ listener ตัวใดตัวหนึ่งไม่ใช่ทั้ง Gateway
    sectionName: http
  # ⚠️ ห้ามใส่ค่าจริงลงไฟล์นี้ — repo เป็น public
  #    ส่งตอน deploy เหมือน ingress.host เดิม:
  #      --set httpRoute.hostnames[0]="${{ secrets.INGRESS_HOST }}"
  #
  #    ระหว่างช่วงย้ายต้องส่ง "สองชื่อ" — ชื่อที่ cloudflared เขียน Host ทับให้
  #    กับชื่อที่เบราว์เซอร์เห็นจริง ใส่ทั้งคู่ทำให้ถอด originRequest.httpHostHeader
  #    ออกจาก cloudflared ได้ในภายหลังโดยไม่ต้องแตะ route
  #      --set httpRoute.hostnames[1]="${{ secrets.PUBLIC_HOST }}"
  #
  #    ว่างไว้แล้วเปิด enabled = helm จะ fail ทันทีพร้อมข้อความบอกเหตุ
  hostnames: []
  # สอง path ยิงเข้า backend เดียวกัน — match ใน rule เดียวกันเป็น OR
  paths:
    - type: PathPrefix
      value: /api/v1/events
    - type: PathPrefix
      value: /api/v1/admin/events


resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# --- Lifecycle ---
#
# ⚠️ ค่าเหล่านี้สัมพันธ์กัน ห้ามแก้ตัวเดียวโดยไม่ดูตัวอื่น
#   SHUTDOWN_DRAIN_DELAY + SHUTDOWN_TIMEOUT (5+20 = 25s)
#     < terminationGracePeriodSeconds (45s)  ✅ ไม่งั้นโดน SIGKILL ก่อนปิดเสร็จ
terminationGracePeriodSeconds: 45

# livenessProbe จงใจไม่เช็ค DB
# ถ้าเช็คแล้ว DB ล่ม k8s จะฆ่าทุก pod พร้อมกันแล้ววนรีสตาร์ตไม่จบ
livenessProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

startupProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 2
  failureThreshold: 30

shutdown:
  drainDelay: 5s
  timeout: 20s

# --- Database ---
#
# 🔴 ของเดิมต่อด้วย vertex_admin ซึ่งเป็น superuser
#    service ที่แค่ต้องเขียน log อ่านและลบข้อมูลของ pet และ auth ได้หมด
#    ตอนนี้ใช้ event_app ที่ทำได้แค่ DML ใน schema event เท่านั้น
db:
  host: postgres
  port: "5432"
  name: vertex
  sslMode: disable
  searchPath: event
  credentialsSecret: event-db-app

# --- JWT ---
#
# public key ชุดเดียวกับที่ auth-service ออก token
# รับหลายใบต่อกันได้ เพื่อ rotate โดยไม่ downtime
jwt:
  publicKeysSecret: jwt-public-keys
  issuer: ""
  audience: ""

# --- Ingest ---
#
# token ที่ service ต้นทาง (pet-service) ต้องส่งมาใน X-Service-Token
# ต้องเป็นค่าเดียวกับ EVENT_INGEST_TOKEN ที่ pet-service ถือ
ingest:
  tokenSecret: event-ingest-token

env: {}

# ให้ Prometheus มาดึง /metrics (VT-109)
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # ⚠️ Prometheus ในคลัสเตอร์นี้ตั้ง serviceMonitorSelector ไว้ที่
  #      matchLabels: {release: prometheus-grafana}
  #    ไม่ใส่ label นี้ = ServiceMonitor ถูกสร้างแต่ไม่มีใครมาดึงเลย
  #    และไม่มีอะไรฟ้อง ต้องไปสังเกตเองว่ากราฟว่าง
  #    ตรวจได้ด้วย kubectl get prometheus -A -o jsonpath='{.items[*].spec.serviceMonitorSelector}'
  additionalLabels:
    release: prometheus-grafana
